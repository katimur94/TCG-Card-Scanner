<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HoloScan – Pokémon Karten-Scanner</title>
  <meta name="description" content="Pokémon-Karten scannen und sofort den Cardmarket-Preis sehen – mit Spracherkennung, Sammlung, Serienscan und Offline-Modus.">
  <meta name="theme-color" content="#07060d">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HoloScan">
  <meta name="application-name" content="HoloScan">
  <meta property="og:title" content="HoloScan – Pokémon Karten-Scanner">
  <meta property="og:description" content="Karte scannen, Cardmarket-Preis sehen. Installierbar, offlinefähig, mehrsprachig.">
  <meta property="og:image" content="assets/icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://api.tcgdex.net" crossorigin>
  <link rel="preconnect" href="https://assets.tcgdex.net">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>

  <div id="app" class="app" data-view="scan">
    <header class="topbar">
      <div class="brand">
        <img src="assets/icons/icon.svg" alt="" width="30" height="30">
        <span class="brand-name">Holo<b>Scan</b></span>
        <span class="brand-badge">Premium</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" data-action="open-history" aria-label="Scan-Verlauf">
          <svg viewBox="0 0 24 24"><path d="M12 8v4l2.5 2.5"/><path d="M3.05 11a9 9 0 1 1 .5 4"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </header>

    <main class="views">
      <!-- ============ SCAN ============ -->
      <section class="view view-scan" id="view-scan" aria-label="Scanner">
        <div class="stage" id="stage">
          <video id="video" playsinline muted autoplay></video>
          <canvas id="freeze" class="freeze" aria-hidden="true"></canvas>

          <div class="stage-mask" aria-hidden="true">
            <div class="guide" id="guide">
              <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
              <div class="beam"></div>
              <div class="guide-zone zone-top"></div>
              <div class="guide-zone zone-bottom"></div>
              <svg class="auto-ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg>
            </div>
          </div>

          <div class="stage-top">
            <button class="chip chip-glass" data-action="toggle-batch" id="btn-batch" aria-pressed="false">
              <svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>
              <span>Serienscan</span>
            </button>
            <button class="chip chip-glass" data-action="toggle-auto" id="btn-auto" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
              <span>Auto</span>
            </button>
            <button class="chip chip-glass" data-action="pick-scan-lang" id="btn-scan-lang">
              <span class="flag" id="scan-lang-flag">🌐</span>
              <span id="scan-lang-label">Auto</span>
            </button>
          </div>

          <div class="stage-hint" id="stage-hint">Karte im Rahmen ausrichten</div>

          <div class="batch-tray" id="batch-tray" hidden>
            <div class="batch-head">
              <div>
                <div class="batch-label">Serienscan</div>
                <div class="batch-total" id="batch-total">0,00 €</div>
              </div>
              <div class="batch-count" id="batch-count">0 Karten</div>
              <button class="btn btn-small btn-gold" data-action="batch-review">Ansehen</button>
            </div>
            <div class="batch-strip" id="batch-strip"></div>
          </div>

          <div class="stage-controls">
            <button class="round-btn" data-action="pick-photo" aria-label="Foto aus Galerie wählen">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L7 20"/></svg>
            </button>
            <button class="shutter" id="shutter" data-action="capture" aria-label="Karte scannen">
              <span class="shutter-ring"></span>
              <span class="shutter-core"></span>
            </button>
            <button class="round-btn" data-action="toggle-torch" id="btn-torch" aria-label="Taschenlampe" disabled>
              <svg viewBox="0 0 24 24"><path d="M9 2h6l-1 6h-4z"/><path d="M10 8h4v5l-1 9h-2l-1-9z"/></svg>
            </button>
          </div>

          <div class="stage-status" id="stage-status" hidden>
            <div class="status-orb"></div>
            <div class="status-text" id="status-text">Text wird erkannt …</div>
            <div class="status-sub" id="status-sub"></div>
          </div>

          <div class="camera-intro" id="camera-intro">
            <div class="intro-art" aria-hidden="true">
              <div class="intro-card"><div class="intro-shine"></div></div>
              <div class="intro-beam"></div>
            </div>
            <h1>Karte scannen.<br><span class="text-holo">Wert sofort sehen.</span></h1>
            <p>Erkennt Pokémon-Karten in Deutsch, Englisch, Französisch, Spanisch, Italienisch, Portugiesisch und Japanisch – mit aktuellem Cardmarket-Preis.</p>
            <button class="btn btn-gold btn-lg" data-action="start-camera">
              <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
              Kamera starten
            </button>
            <button class="btn btn-ghost" data-action="pick-photo">Foto auswählen</button>
            <p class="intro-note" id="camera-error" hidden></p>
          </div>
        </div>
        <input type="file" id="file-input" accept="image/*" hidden>
      </section>

      <!-- ============ COLLECTION ============ -->
      <section class="view view-collection" id="view-collection" aria-label="Sammlung">
        <div class="scroll">
          <div class="portfolio" id="portfolio"></div>
          <div class="seg" role="tablist" id="coll-tabs">
            <button role="tab" class="seg-btn is-active" data-list="collection">Sammlung</button>
            <button role="tab" class="seg-btn" data-list="wish">Merkliste</button>
          </div>
          <div class="toolbar">
            <label class="select">
              <span class="visually-hidden">Sortierung</span>
              <select id="coll-sort">
                <option value="value">Wert ↓</option>
                <option value="added">Neueste</option>
                <option value="name">Name A–Z</option>
                <option value="set">Set</option>
                <option value="change">Veränderung</option>
              </select>
            </label>
            <label class="select">
              <span class="visually-hidden">Sprache filtern</span>
              <select id="coll-lang"><option value="">Alle Sprachen</option></select>
            </label>
          </div>
          <div class="coll-grid" id="coll-grid"></div>
        </div>
      </section>

      <!-- ============ SEARCH ============ -->
      <section class="view view-search" id="view-search" aria-label="Suche">
        <div class="scroll">
          <h2 class="view-title">Karte suchen</h2>
          <div class="search-bar">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search-input" type="search" inputmode="search" autocomplete="off" placeholder="Name oder Nummer, z. B. Glurak, 4/102, MEW 25">
            <button class="chip chip-soft" data-action="pick-search-lang" id="btn-search-lang"><span class="flag">🇩🇪</span><span>DE</span></button>
          </div>
          <div class="search-hints" id="search-hints">
            <button class="chip chip-soft" data-q="Glurak">Glurak</button>
            <button class="chip chip-soft" data-q="Pikachu">Pikachu</button>
            <button class="chip chip-soft" data-q="MEW 25">MEW 25</button>
            <button class="chip chip-soft" data-q="4/102">4/102</button>
            <button class="chip chip-soft" data-q="Mewtu ex">Mewtu ex</button>
          </div>
          <div class="search-results" id="search-results"></div>
        </div>
      </section>

      <!-- ============ MORE ============ -->
      <section class="view view-more" id="view-more" aria-label="Mehr">
        <div class="scroll" id="more-root"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Navigation">
      <button class="tab is-active" data-view="scan">
        <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        <span>Scannen</span>
      </button>
      <button class="tab" data-view="collection">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Sammlung</span>
      </button>
      <button class="tab" data-view="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Suche</span>
      </button>
      <button class="tab" data-view="more">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Mehr</span>
      </button>
    </nav>
  </div>

  <!-- Bottom-Sheet (Ergebnis, Verlauf, Auswahl) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
    <div class="sheet-handle" id="sheet-handle"><span></span></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
